<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>闪电邮 - 极速接码平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { background-color: #0a0a0a; color: #e5e5e5; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
        .input-dark { background-color: #262626; border: 1px solid #404040; color: #d4d4d4; }
        .input-dark:focus { border-color: #525252; outline: none; }
        .btn-dark { background-color: #333333; border: 1px solid #404040; color: #ffffff; }
        .btn-dark:hover { background-color: #404040; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #141414; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .mail-row:hover { background-color: #1a1a1a; cursor: pointer; }
    </style>
</head>
<body class="h-screen flex flex-col relative">

    <div id="app" class="flex flex-col h-full">
        
        <div v-if="showAuthModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
            <div class="bg-[#141414] border border-[#333] p-8 rounded-2xl shadow-2xl w-96 max-w-full">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">{{ authMode === 'login' ? '🔑 账号登录' : '📝 注册账号' }}</h2>
                    <button @click="showAuthModal = false" class="text-gray-500 hover:text-white">✖</button>
                </div>
                <div class="space-y-4">
                    <input v-model="authForm.username" type="text" placeholder="用户名" class="w-full input-dark rounded-lg px-4 py-3">
                    <input v-model="authForm.password" type="password" placeholder="密码" class="w-full input-dark rounded-lg px-4 py-3">
                    <button @click="handleAuth" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition">
                        {{ authMode === 'login' ? '登 录' : '注 册' }}
                    </button>
                </div>
                <div class="mt-6 text-center text-sm text-gray-500">
                    <button @click="authMode = authMode === 'login' ? 'register' : 'login'" class="hover:text-blue-400">
                        {{ authMode === 'login' ? '没有账号？点击注册' : '已有账号？直接登录' }}
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-[#141414] border-b border-[#262626] p-4 flex justify-between items-center shrink-0">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">闪电邮</h1>
                
                <div class="flex items-center text-xs bg-[#1f1f1f] border border-[#333] rounded overflow-hidden focus-within:border-blue-500 transition-colors">
                    <span class="text-gray-500 px-2 py-1 bg-[#141414] border-r border-[#333]">POP3:</span>
                    <input v-model="publicPopServer" type="text" class="bg-transparent text-gray-300 px-2 py-1 w-40 outline-none focus:text-white font-mono" placeholder="读取中...">
                    <span class="text-gray-500 px-2 py-1 bg-[#141414] border-l border-r border-[#333]">端口:</span>
                    <input v-model="publicPopPort" type="text" class="bg-transparent text-gray-300 px-2 py-1 w-12 outline-none focus:text-white font-mono text-center" placeholder="...">
                    <button @click="saveSystemConfig" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 font-bold transition border-l border-[#333]">确认修改</button>
                </div>
            </div>
            
            <div class="flex items-center gap-4 text-sm font-bold">
                <template v-if="currentUser">
                    <span class="text-green-400">👋 你好，{{ currentUser.username }} (云端同步中)</span>
                    <button @click="logout" class="text-gray-500 hover:text-red-400 transition">退出</button>
                </template>
                <template v-else>
                    <span class="text-gray-500">👤 游客模式 (仅存本地)</span>
                    <button @click="showAuthModal = true; authMode = 'login'" class="bg-[#262626] hover:bg-[#333] border border-[#404040] px-4 py-1.5 rounded-lg transition text-white">
                        登录 / 注册
                    </button>
                </template>
            </div>
        </div>

        <div class="flex flex-1 overflow-hidden">
            <div class="w-1/3 min-w-[320px] border-r border-[#262626] bg-[#0f0f0f] flex flex-col p-4 gap-4">
                
                <div class="bg-[#191919] border border-[#262626] p-4 rounded-xl shrink-0 space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="font-bold text-gray-200">快速生成</h2>
                        <div class="flex items-center gap-3 text-xs">
                            <button @click="isAddingDomain = !isAddingDomain" class="text-gray-500 hover:text-blue-400">添加域名</button>
                            <button v-if="selectedDomain" @click="deleteSelectedDomain" class="text-gray-500 hover:text-red-400">删除当前</button>
                        </div>
                    </div>

                    <div v-if="isAddingDomain" class="flex gap-2">
                        <input v-model="newDomainInput" type="text" placeholder="输入邮箱后缀 (例: a.com)" @keyup.enter="addNewDomain" class="input-dark rounded px-3 py-1.5 text-sm flex-1">
                        <button @click="addNewDomain" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded text-sm font-bold">+</button>
                    </div>

                    <div v-else class="flex gap-2">
                        <input v-model="prefix" type="text" placeholder="自定义前缀 (留空随机)" class="input-dark rounded px-3 py-2 text-sm flex-1 w-1/2">
                        <select v-model="selectedDomain" class="input-dark rounded px-2 py-2 text-sm font-mono outline-none w-1/2 cursor-pointer">
                            <option v-if="domains.length === 0" value="" disabled>暂无域名</option>
                            <option v-for="dom in domains" :key="dom" :value="dom">@{{ dom }}</option>
                        </select>
                    </div>

                    <button @click="createAccount" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-lg text-sm font-bold shadow-lg transition flex items-center justify-center gap-2">
                        ⚡ 生成专属邮箱
                    </button>
                </div>

                <div class="flex-1 overflow-y-auto bg-[#191919] border border-[#262626] rounded-xl p-2">
                    <div class="space-y-1">
                        <div v-for="(acc, idx) in accounts" :key="idx" 
                             @click="selectAccount(acc)"
                             :class="activeAccount && activeAccount.email === acc.email ? 'bg-blue-900/40 border-blue-500/50' : 'bg-[#141414] border-[#262626] hover:bg-[#222]'"
                             class="border rounded-lg p-3 cursor-pointer transition flex justify-between items-center group relative">
                            
                            <div class="overflow-hidden w-full pr-6 flex flex-col">
                                <input v-model="acc.remark" @change="syncData" @click.stop @focus="selectAccount(acc)" 
                                       type="text" placeholder="✏️ 点击添加备注..." 
                                       class="bg-transparent text-yellow-500 text-sm font-bold w-full outline-none placeholder-gray-600 mb-1.5 border-b border-transparent hover:border-[#333] focus:border-yellow-500 transition-colors pb-0.5 truncate">
                                
                                <div class="font-mono text-sm text-gray-200 font-bold truncate">{{ acc.email }}</div>
                                <div class="font-mono text-xs text-gray-500 mt-1 truncate">密: <span class="text-green-500/80">{{ acc.password }}</span></div>
                            </div>
                            
                            <button @click.stop="removeAccount(idx)" class="absolute right-3 top-1/2 -translate-y-1/2 text-red-500 opacity-0 group-hover:opacity-100 transition hover:text-red-400 bg-[#141414] p-1 rounded">
                                ✖
                            </button>
                        </div>
                    </div>
                </div>

            </div>

            <div class="flex-1 bg-[#0a0a0a] flex flex-col relative overflow-hidden">
                
                <div v-if="!activeAccount" class="absolute inset-0 flex items-center justify-center text-gray-600">
                    <div class="text-center space-y-4">
                        <div class="text-5xl">📬</div>
                        <p>请在左侧生成或选择邮箱</p>
                    </div>
                </div>

                <template v-else>
                    <div class="p-6 border-b border-[#262626] bg-[#111] shrink-0">
                        <div class="flex justify-between items-center mb-1">
                            <h2 class="text-2xl font-bold text-white font-mono break-all">{{ activeAccount.email }}</h2>
                            <button @click="copyActiveConfig" class="bg-[#262626] hover:bg-[#333] border border-[#404040] text-gray-300 px-4 py-2 rounded-lg text-sm font-bold transition whitespace-nowrap">
                                📋 复制 POP3 配置
                            </button>
                        </div>
                        <div class="text-sm text-gray-500">密码: <span class="font-mono text-green-400 font-bold">{{ activeAccount.password }}</span></div>
                    </div>

                    <div v-if="!readingMail" class="flex-1 overflow-y-auto">
                        <div class="p-6 pb-2 flex justify-between items-center sticky top-0 bg-[#0a0a0a] z-10 border-b border-[#262626]">
                            <h3 class="text-lg font-bold">收件箱列表</h3>
                            <div class="text-sm flex items-center gap-2 text-gray-500">
                                <span v-if="!loading" class="inline-block w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                <span v-else class="inline-block w-2 h-2 rounded-full bg-yellow-500"></span>
                                1秒同步中
                            </div>
                        </div>

                        <div v-if="emails.length === 0" class="text-center py-20 text-gray-500">
                            等待接收邮件...
                        </div>

                        <div v-else class="divide-y divide-[#262626]">
                            <div v-for="(mail, idx) in emails" :key="idx" 
                                 @click="openMail(mail)"
                                 class="mail-row p-4 flex items-center gap-4 group">
                                <div class="w-1/4 shrink-0 font-bold text-gray-300 truncate" :title="mail.from">{{ mail.from.split('<')[0] || mail.from }}</div>
                                <div class="flex-1 truncate">
                                    <span class="text-white font-bold mr-2">{{ mail.subject }}</span>
                                    <span class="text-gray-500 text-sm">- {{ mail.snippet }}</span>
                                </div>
                                <div class="text-xs text-gray-600 group-hover:text-gray-400 shrink-0">{{ mail.date.split(' ').slice(1,4).join(' ') || mail.date }}</div>
                            </div>
                        </div>
                    </div>

                    <div v-else class="flex-1 flex flex-col bg-[#141414] overflow-hidden">
                        <div class="p-4 border-b border-[#333] flex items-center gap-4 bg-[#1a1a1a]">
                            <button @click="readingMail = null" class="bg-[#333] hover:bg-[#444] text-white px-3 py-1.5 rounded flex items-center gap-2 text-sm font-bold transition">
                                ⬅ 返回列表
                            </button>
                            <div class="flex-1 overflow-hidden">
                                <h3 class="font-bold text-white text-lg truncate">{{ readingMail.subject }}</h3>
                                <div class="text-xs text-gray-400 mt-1 truncate">发件人: {{ readingMail.from }}</div>
                            </div>
                            <div class="text-xs text-gray-500 shrink-0">{{ readingMail.date }}</div>
                        </div>
                        <div v-if="readingMail.attachments && readingMail.attachments.length" class="px-4 py-3 border-b border-[#333] bg-[#181818] flex flex-wrap items-center gap-2">
                            <span class="text-xs text-gray-400 mr-1">附件</span>
                            <button v-for="att in readingMail.attachments" :key="att.index"
                                    @click="downloadAttachment(att)"
                                    class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded text-xs font-bold transition max-w-full truncate">
                                {{ att.filename }} ({{ formatSize(att.size) }})
                            </button>
                        </div>
                        <div class="flex-1 overflow-hidden p-4">
                            <iframe :srcdoc="readingMail.full_html" 
                                    sandbox="allow-popups allow-popups-to-escape-sandbox allow-scripts allow-forms"
                                    class="w-full h-full bg-white rounded-lg shadow-inner border-0"></iframe>
                        </div>
                    </div>

                </template>

            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, watch, onMounted } = Vue;

        createApp({
            setup() {
                const publicPopServer = ref('');
                const publicPopPort = ref('');
                
                const domains = ref(JSON.parse(localStorage.getItem('savedDomains') || '[]'));
                const selectedDomain = ref(domains.value.length > 0 ? domains.value[0] : '');
                
                const isAddingDomain = ref(false);
                const newDomainInput = ref('');

                const currentUser = ref(JSON.parse(localStorage.getItem('appUser') || 'null'));
                const showAuthModal = ref(false);
                const authMode = ref('login');
                const authForm = ref({ username: '', password: '' });

                const prefix = ref('');
                const accounts = ref(JSON.parse(localStorage.getItem('savedAccounts') || '[]'));
                const activeAccount = ref(null);
                
                const emails = ref([]);
                const loading = ref(false);
                let pollingTimer = null; 
                
                const readingMail = ref(null);

                watch(accounts, (val) => localStorage.setItem('savedAccounts', JSON.stringify(val)), { deep: true });
                const saveDomains = () => localStorage.setItem('savedDomains', JSON.stringify(domains.value));

                const loadDomains = async () => {
                    try {
                        const res = await fetch('/api/admin/config');
                        if (!res.ok) return;

                        const data = await res.json();
                        const serverDomains = [...new Set(
                            (data.domains || [])
                                .map(domain => String(domain).trim().toLowerCase())
                                .filter(Boolean)
                        )];

                        domains.value = serverDomains;
                        saveDomains();

                        if (!serverDomains.includes(selectedDomain.value)) {
                            selectedDomain.value = serverDomains[0] || '';
                        }
                        if (!selectedDomain.value) isAddingDomain.value = true;
                    } catch (e) {
                        console.error("域名列表拉取失败，继续使用本地缓存");
                    }
                };

                // ========== 核心新增逻辑：对接后端配置接口 ==========
                const loadSystemConfig = async () => {
                    try {
                        const res = await fetch('/api/system_config');
                        if (res.ok) {
                            const data = await res.json();
                            publicPopServer.value = data.pop_host;
                            publicPopPort.value = data.pop_port;
                        }
                    } catch (e) { console.error("配置拉取失败"); }
                };

                const saveSystemConfig = async () => {
                    try {
                        const res = await fetch('/api/admin/system_config', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ pop_host: publicPopServer.value, pop_port: parseInt(publicPopPort.value) || 110 })
                        });
                        if (res.ok) {
                            alert("✅ 后端系统配置已同步！\n\n注意：若您修改了端口号，为使底层监听彻底生效，请登录服务器终端执行重启命令。");
                        } else {
                            alert("❌ 保存失败，请检查网络。");
                        }
                    } catch (e) { alert("网络错误"); }
                };
                // ===============================================

                const handleAuth = async () => {
                    if(!authForm.value.username || !authForm.value.password) return alert("请填写完整");
                    try {
                        const url = authMode.value === 'login' ? '/api/auth/login' : '/api/auth/register';
                        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(authForm.value) });
                        const data = await res.json();
                        if(res.ok) {
                            currentUser.value = { username: data.username, token: data.token };
                            localStorage.setItem('appUser', JSON.stringify(currentUser.value));
                            showAuthModal.value = false;
                            authForm.value = { username: '', password: '' };
                            await fetchCloudAccounts(); 
                        } else alert(data.detail || "操作失败");
                    } catch { alert("网络错误"); }
                };

                const logout = () => {
                    currentUser.value = null;
                    localStorage.removeItem('appUser');
                    accounts.value = []; 
                    activeAccount.value = null;
                    readingMail.value = null;
                };

                const fetchCloudAccounts = async () => {
                    if(!currentUser.value) return;
                    const res = await fetch('/api/user/accounts', { headers: { 'Authorization': currentUser.value.token } });
                    if(res.ok) {
                        const data = await res.json();
                        const cloudEmails = data.accounts.map(a => a.email);
                        const merged = [...data.accounts];
                        for(let loc of accounts.value) {
                            if(!cloudEmails.includes(loc.email)) merged.push(loc);
                        }
                        accounts.value = merged;
                        syncData(); 
                    }
                };

                const syncData = async () => {
                    if(!currentUser.value || accounts.value.length === 0) return;
                    fetch('/api/user/sync', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': currentUser.value.token },
                        body: JSON.stringify({ accounts: accounts.value })
                    }).catch(()=>{});
                };

                const startPolling = () => {
                    stopPolling(); 
                    pollingTimer = setInterval(() => { if (activeAccount.value && !loading.value) fetchEmails(true); }, 1000); 
                };

                const stopPolling = () => {
                    if (pollingTimer) { clearInterval(pollingTimer); pollingTimer = null; }
                };

                const addNewDomain = async () => {
                    const newDom = newDomainInput.value.trim().toLowerCase();
                    if (!newDom) return;
                    await fetch('/api/admin/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ domain_suffix: newDom, display_name: '', pop3_server: '', pop3_port: 110, use_ssl: false, is_active: true }) });
                    if (!domains.value.includes(newDom)) { 
                        domains.value.push(newDom); 
                        saveDomains();
                    }
                    selectedDomain.value = newDom;
                    isAddingDomain.value = false;
                    newDomainInput.value = '';
                };

                const deleteSelectedDomain = async () => {
                    const domain = selectedDomain.value;
                    if (!domain) return;
                    if (!confirm(`确认删除域名后缀 @${domain}？已生成邮箱和历史邮件不会被删除。`)) return;
                    try {
                        await fetch(`/api/admin/config/${encodeURIComponent(domain)}`, { method: 'DELETE' });
                    } catch (e) {}
                    domains.value = domains.value.filter(dom => dom !== domain);
                    saveDomains();
                    selectedDomain.value = domains.value[0] || '';
                    if (!selectedDomain.value) isAddingDomain.value = true;
                };

                const createAccount = async () => {
                    if (!selectedDomain.value || domains.value.length === 0) {
                        alert("⚠️ 请先点击上方的【添加域名】，输入您解析好的邮箱后缀！");
                        isAddingDomain.value = true;
                        return;
                    }

                    let currentPrefix = prefix.value.trim();
                    if (!currentPrefix) currentPrefix = Math.random().toString(36).substring(2, 10);
                    const randomPassword = Math.random().toString(36).substring(2, 10).toUpperCase();
                    
                    const newAcc = { email: `${currentPrefix}@${selectedDomain.value}`, password: randomPassword, remark: '' };
                    
                    const headers = { 'Content-Type': 'application/json' };
                    if (currentUser.value) headers['Authorization'] = currentUser.value.token;
                    try {
                        await fetch('/api/account/create', {
                            method: 'POST',
                            headers: headers,
                            body: JSON.stringify(newAcc)
                        });
                    } catch (e) {}

                    accounts.value.unshift(newAcc);
                    prefix.value = '';
                    selectAccount(newAcc);
                };

                const selectAccount = (acc) => {
                    activeAccount.value = acc;
                    emails.value = [];
                    readingMail.value = null; 
                    fetchEmails(); 
                    startPolling(); 
                };

                const removeAccount = async (idx) => {
                    const email = accounts.value[idx].email;
                    if (activeAccount.value && activeAccount.value.email === email) { 
                        activeAccount.value = null; 
                        readingMail.value = null;
                        stopPolling(); 
                    }
                    accounts.value.splice(idx, 1);

                    if (currentUser.value) {
                        try {
                            await fetch('/api/account/unlink', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': currentUser.value.token },
                                body: JSON.stringify({ email: email })
                            });
                        } catch (e) {}
                    }
                };

                const fetchEmails = async (isSilent = false) => {
                    if (!activeAccount.value) return;
                    if (!isSilent) loading.value = true; 
                    try {
                        const res = await fetch('/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: activeAccount.value.email, password: activeAccount.value.password })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            
                            const processedEmails = data.emails.map(mail => {
                                let htmlContent = mail.full_html;
                                if (!/<\s*base\s+[^>]*target\s*=/i.test(htmlContent)) {
                                    htmlContent = '<base target="_blank">' + htmlContent;
                                }
                                return { ...mail, full_html: htmlContent };
                            });

                            if (JSON.stringify(emails.value) !== JSON.stringify(processedEmails)) {
                                const currentReadingSubject = readingMail.value ? readingMail.value.subject : null;
                                emails.value = processedEmails;
                                if (currentReadingSubject) {
                                    const updatedMail = emails.value.find(m => m.subject === currentReadingSubject);
                                    if (updatedMail) readingMail.value = updatedMail;
                                }
                            }
                        } else {
                            if (!isSilent) alert("凭证错误，如果是在别的设备注册的，请先登录账号。");
                            stopPolling(); 
                        }
                    } catch { } finally { loading.value = false; }
                };

                const copyActiveConfig = async () => {
                    if (!activeAccount.value) return;
                    const text = `账号: ${activeAccount.value.email}\n密码: ${activeAccount.value.password}\n服务器: ${publicPopServer.value}\n端口: ${publicPopPort.value}`;
                    await navigator.clipboard.writeText(text);
                    alert("✅ 复制成功！可直接填入自动化软件。");
                };

                const openMail = (mail) => {
                    readingMail.value = mail;
                };

                const formatSize = (bytes) => {
                    if (!bytes) return '0 B';
                    if (bytes < 1024) return `${bytes} B`;
                    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
                    return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
                };

                const downloadAttachment = async (attachment) => {
                    if (!activeAccount.value || !readingMail.value || !readingMail.value.id) return;
                    const res = await fetch('/api/mail/attachment', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: activeAccount.value.email,
                            password: activeAccount.value.password,
                            mail_id: readingMail.value.id,
                            part_index: attachment.index
                        })
                    });
                    if (!res.ok) {
                        alert('附件下载失败');
                        return;
                    }
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = attachment.filename || 'attachment';
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    URL.revokeObjectURL(url);
                };

                onMounted(async () => {
                    await loadSystemConfig(); // 页面加载时自动拉取最新配置
                    await loadDomains();
                    if(currentUser.value) await fetchCloudAccounts();
                    if (accounts.value.length > 0) selectAccount(accounts.value[0]);
                });

                return {
                    publicPopServer, publicPopPort, domains, selectedDomain, isAddingDomain, newDomainInput,
                    currentUser, showAuthModal, authMode, authForm, handleAuth, logout,
                    prefix, accounts, activeAccount, emails, loading, syncData, readingMail,
