<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员面板 - Mail Login Panel</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
      color: #111827;
    }

    .hidden { display: none !important; }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: rgba(255,255,255,.94);
      border-radius: 24px;
      box-shadow: 0 30px 90px rgba(0,0,0,.28);
      border: 1px solid rgba(255,255,255,.5);
    }

    .login-card {
      width: 420px;
      padding: 34px;
    }

    h1, h2, h3 { margin: 0; letter-spacing: -0.04em; }

    .sub {
      margin-top: 8px;
      color: #6b7280;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 700;
      font-size: 14px;
      color: #374151;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 0 14px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99,102,241,.15);
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    .btn-primary {
      width: 100%;
      height: 50px;
      margin-top: 22px;
      background: #4f46e5;
      color: white;
    }

    .btn-primary:hover { background: #4338ca; }

    .btn-light {
      background: #f3f4f6;
      color: #111827;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-success {
      background: #10b981;
      color: white;
    }

    .error {
      margin-top: 14px;
      color: #dc2626;
      font-size: 14px;
    }

    .app {
      min-height: 100vh;
      padding: 24px;
    }

    .topbar {
      max-width: 1180px;
      margin: 0 auto 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    .topbar h1 {
      font-size: 26px;
    }

    .topbar .right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .grid {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .panel {
      padding: 22px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .stat {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 16px;
    }

    .stat .num {
      font-size: 28px;
      font-weight: 900;
      color: #4f46e5;
    }

    .stat .label {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .row input {
      flex: 1;
    }

    .list {
      margin-top: 16px;
      display: grid;
      gap: 10px;
    }

    .item {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .item-main {
      min-width: 0;
    }

    .item-title {
      font-weight: 850;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .item-sub {
      margin-top: 4px;
      color: #6b7280;
      font-size: 12px;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: stretch; gap: 12px; }
      .stat-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="loginWrap" class="login-wrap">
    <div class="card login-card">
      <h1>管理员登录</h1>
      <div class="sub">管理邮箱后缀、查看在线用户和 POP 状态。</div>

      <label>管理员账号</label>
      <input id="username" placeholder="admin" autocomplete="username" />

      <label>管理员密码</label>
      <input id="password" type="password" placeholder="请输入管理员密码" autocomplete="current-password" />

      <button id="loginBtn" class="btn-primary">登录管理员面板</button>
      <div id="err" class="error hidden"></div>

      <div style="margin-top:18px;font-size:13px;">
        <a href="/" style="color:#4f46e5;text-decoration:none;">返回邮箱登录</a>
      </div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <div class="topbar">
      <div>
        <h1>管理员面板</h1>
        <div style="opacity:.8;margin-top:4px;">Mail Login Panel</div>
      </div>
      <div class="right">
        <button class="btn-light" onclick="loadAll()">刷新</button>
        <button class="btn-light" onclick="logout()">退出</button>
      </div>
    </div>

    <div class="grid">
      <div class="card panel">
        <h2>系统状态</h2>
        <div class="stat-grid">
          <div class="stat">
            <div id="onlineCount" class="num">0</div>
            <div class="label">当前在线人数</div>
          </div>
          <div class="stat">
            <div id="popHost" class="num" style="font-size:18px;">-</div>
            <div class="label">POP 服务</div>
          </div>
          <div class="stat">
            <div id="popSsl" class="num" style="font-size:18px;">-</div>
            <div class="label">SSL/TLS</div>
          </div>
        </div>

        <h3 style="margin-top:24px;">在线用户</h3>
        <div id="userList" class="list"></div>
      </div>

      <div class="card panel">
        <h2>邮箱后缀管理</h2>
        <div class="sub">只允许这些后缀的邮箱登录用户面板。</div>

        <div class="row">
          <input id="domainInput" placeholder="例如 edu.zitw.de" />
          <button class="btn-success" onclick="addDomain()">添加</button>
        </div>

        <div id="domainList" class="list"></div>
      </div>
    </div>
  </div>

  <script>
    let adminToken = sessionStorage.getItem("admin_token") || "";

    const loginWrap = document.getElementById("loginWrap");
    const app = document.getElementById("app");
    const err = document.getElementById("err");

    function showErr(msg) {
      err.textContent = msg;
      err.classList.remove("hidden");
    }

    function clearErr() {
      err.textContent = "";
      err.classList.add("hidden");
    }

    function showLogin() {
      loginWrap.classList.remove("hidden");
      app.classList.add("hidden");
    }

    function showApp() {
      loginWrap.classList.add("hidden");
      app.classList.remove("hidden");
    }

    async function api(path, options = {}) {
      const headers = options.headers || {};
      headers["Content-Type"] = headers["Content-Type"] || "application/json";

      if (adminToken) {
        headers["Authorization"] = "Bearer " + adminToken;
      }

      const res = await fetch(path, { ...options, headers });
      const data = await res.json().catch(() => ({}));

      if (!res.ok || data.success === false) {
        throw new Error(data.detail || data.message || "请求失败");
      }

      return data;
    }

    function fmt(ts) {
      if (!ts) return "-";
      return new Date(ts * 1000).toLocaleString();
    }

    async function login() {
      clearErr();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      try {
        const data = await api("/api/admin/login", {
          method: "POST",
          body: JSON.stringify({ username, password })
        });

        adminToken = data.token;
        sessionStorage.setItem("admin_token", adminToken);

        showApp();
        await loadAll();
      } catch (e) {
        showErr(e.message);
      }
    }

    function logout() {
      adminToken = "";
      sessionStorage.removeItem("admin_token");
      showLogin();
    }

    async function loadStats() {
      const data = await api("/api/admin/stats");

      document.getElementById("onlineCount").textContent = data.online_count;
      document.getElementById("popHost").textContent = data.pop.host + ":" + data.pop.port;
      document.getElementById("popSsl").textContent = data.pop.ssl ? "开启" : "关闭";

      const users = data.users || [];
      const userList = document.getElementById("userList");

      if (!users.length) {
        userList.innerHTML = '<div class="item"><div class="item-main"><div class="item-title">暂无在线用户</div></div></div>';
        return;
      }

      userList.innerHTML = users.map(u => `
        <div class="item">
          <div class="item-main">
            <div class="item-title">${u.email}</div>
            <div class="item-sub">登录：${fmt(u.login_time)} ｜ 最后活跃：${fmt(u.last_active)}</div>
          </div>
        </div>
      `).join("");
    }

    async function loadDomains() {
      const data = await api("/api/admin/domains");

      const domains = data.domains || [];
      const domainList = document.getElementById("domainList");

      if (!domains.length) {
        domainList.innerHTML = '<div class="item"><div class="item-main"><div class="item-title">暂无允许后缀</div></div></div>';
        return;
      }

      domainList.innerHTML = domains.map(d => `
        <div class="item">
          <div class="item-main">
            <div class="item-title">@${d.domain}</div>
            <div class="item-sub">创建时间：${fmt(d.created_at)}</div>
          </div>
          <button class="btn-danger" onclick="deleteDomain('${d.domain}')">删除</button>
        </div>
      `).join("");
    }

    async function loadAll() {
      await Promise.all([loadStats(), loadDomains()]);
    }

    async function addDomain() {
      const input = document.getElementById("domainInput");
      const domain = input.value.trim();

      if (!domain) return alert("请输入邮箱后缀");

      await api("/api/admin/domain", {
        method: "POST",
        body: JSON.stringify({ domain })
      });

      input.value = "";
      await loadDomains();
    }

    async function deleteDomain(domain) {
      if (!confirm("确定删除 @" + domain + " 吗？")) return;

      await api("/api/admin/domain/" + encodeURIComponent(domain), {
        method: "DELETE"
      });

      await loadDomains();
    }

    document.getElementById("loginBtn").addEventListener("click", login);
    document.getElementById("password").addEventListener("keydown", e => {
      if (e.key === "Enter") login();
    });

    if (adminToken) {
      showApp();
      loadAll().catch(() => {
        logout();
      });
    } else {
      showLogin();
    }

    setInterval(() => {
      if (adminToken && !app.classList.contains("hidden")) {
        loadStats().catch(() => {});
      }
    }, 5000);
  </script>
</body>
</html>
