<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)" />
  <title>验证码收件箱</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-2: #f3f4f7;
      --surface-3: #e9ebf0;
      --border: #e4e7ec;
      --border-strong: #d0d5dd;
      --text: #101828;
      --muted: #667085;
      --subtle: #98a2b3;
      --accent: #4f5bd5;
      --accent-hover: #4350c4;
      --accent-soft: #eef0fd;
      --accent-text: #3b47b8;
      --green: #0f9d63;
      --green-strong: #0b8452;
      --green-soft: #e7f7ef;
      --green-border: #bfe8d3;
      --amber: #b7791f;
      --amber-soft: #fdf4e3;
      --red: #d92d20;
      --red-soft: #fdecea;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
      --shadow-md: 0 8px 24px rgba(16, 24, 40, .08);
      --shadow-lg: 0 24px 64px rgba(16, 24, 40, .14);
      --radius: 12px;
      --radius-sm: 8px;
      --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, monospace;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1013;
        --surface: #15181c;
        --surface-2: #1b1f24;
        --surface-3: #242930;
        --border: #262b32;
        --border-strong: #353b44;
        --text: #eef1f5;
        --muted: #98a1ae;
        --subtle: #6b7380;
        --accent: #7380f0;
        --accent-hover: #8590f4;
        --accent-soft: rgba(115, 128, 240, .14);
        --accent-text: #a5aef7;
        --green: #3ccf91;
        --green-strong: #2fb87e;
        --green-soft: rgba(60, 207, 145, .1);
        --green-border: rgba(60, 207, 145, .28);
        --amber: #e6b25a;
        --amber-soft: rgba(230, 178, 90, .12);
        --red: #f07167;
        --red-soft: rgba(240, 113, 103, .12);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, .35);
        --shadow-lg: 0 24px 64px rgba(0, 0, 0, .5);
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
    svg.icon { width: 16px; height: 16px; flex: 0 0 auto; }

    /* ---------- Buttons ---------- */
    .btn {
      height: 36px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 0 14px;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      background: transparent;
      cursor: pointer;
      font-size: 13px; font-weight: 600;
      white-space: nowrap;
      transition: background-color .15s, border-color .15s, color .15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: .6; cursor: progress; }
    .btn-secondary { border-color: var(--border); background: var(--surface); box-shadow: var(--shadow-sm); }
    .btn-secondary:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .btn-ghost { color: var(--muted); }
    .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
    .btn-icon { width: 36px; padding: 0; }
    .btn-block { width: 100%; height: 44px; font-size: 14px; }

    /* ---------- Login ---------- */
    .login-page {
      height: 100dvh;
      overflow: auto;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background:
        radial-gradient(1200px 600px at 10% -10%, var(--accent-soft), transparent 60%),
        radial-gradient(900px 500px at 110% 110%, var(--green-soft), transparent 60%),
        var(--bg);
    }
    .login-card {
      width: min(420px, 100%);
      padding: 36px 32px 28px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow-lg);
    }
    .brand-mark {
      width: 44px; height: 44px;
      display: grid; place-items: center;
      border-radius: 13px;
      background: linear-gradient(140deg, var(--accent), #8b6cf0);
      color: #fff;
      box-shadow: 0 8px 20px rgba(79, 91, 213, .28);
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .login-card h1 { margin: 22px 0 6px; font-size: 24px; line-height: 1.25; letter-spacing: -.02em; }
    .login-card .lead { margin: 0 0 26px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .field { margin-bottom: 16px; }
    .field label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
    .control {
      width: 100%; height: 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 13px;
      background: var(--surface);
      font-size: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .control::placeholder { color: var(--subtle); }
    .control:hover { border-color: var(--border-strong); }
    .control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .login-card .btn-block { margin-top: 6px; }
    .error {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--red-soft);
      color: var(--red);
      font-size: 13px; line-height: 1.5;
    }
    .features { margin: 26px 0 0; padding: 18px 0 0; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px 16px; list-style: none; color: var(--muted); font-size: 12px; }
    .features li { display: flex; align-items: center; gap: 6px; }
    .features li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
    .admin-link { margin-top: 18px; text-align: center; font-size: 12.5px; }
    .admin-link a { color: var(--muted); text-decoration: none; font-weight: 600; }
    .admin-link a:hover { color: var(--accent); }

    /* ---------- App ---------- */
    .app { height: 100dvh; display: flex; flex-direction: column; }
    .topbar {
      height: 64px; flex: 0 0 64px;
      padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .app-brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .app-brand .brand-mark { width: 34px; height: 34px; border-radius: 10px; box-shadow: 0 6px 16px rgba(79, 91, 213, .25); }
    .app-brand .brand-mark svg { width: 18px; height: 18px; }
    .brand-title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
    .brand-subtitle { margin-top: 2px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font: 12px var(--mono); }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .status-pill {
      height: 30px; padding: 0 12px;
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 12px; font-weight: 600;
    }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); animation: pulse 2s infinite; }
    .status-pill.fast { color: var(--green); border-color: var(--green-border); background: var(--green-soft); }
    .status-pill.fast .live-dot { animation-duration: .8s; }
    @keyframes pulse { 50% { opacity: .4; } }

    .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 400px minmax(0, 1fr); }
    .sidebar { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--surface); }
    .sidebar-head { padding: 16px 18px 14px; border-bottom: 1px solid var(--border); }
    .sidebar-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sidebar-title { font-size: 15px; font-weight: 700; }
    .mail-count { height: 22px; padding: 0 9px; display: inline-flex; align-items: center; border-radius: 999px; background: var(--surface-3); color: var(--muted); font-size: 11.5px; font-weight: 650; }
    .sidebar-controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .filter-tabs { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
    .filter-tab {
      height: 28px; padding: 0 12px;
      border: 0; border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12.5px; font-weight: 600;
    }
    .filter-tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
    .sidebar-actions { display: flex; gap: 6px; }
    .sidebar-actions .btn { height: 34px; padding: 0 11px; font-size: 12.5px; }
    .btn-boost { border-color: var(--green-border); background: var(--green-soft); color: var(--green); }
    .btn-boost:hover { border-color: var(--green); }

    .mail-list { flex: 1; min-height: 0; overflow: auto; padding: 10px; }
    .mail-item {
      margin-bottom: 6px;
      padding: 13px 14px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background-color .12s, border-color .12s;
    }
    .mail-item:hover { background: var(--surface-2); }
    .mail-item.active { background: var(--accent-soft); border-color: var(--accent); }
    .mail-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .mail-subject { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; font-weight: 650; line-height: 1.4; }
    .mail-time { flex: 0 0 auto; color: var(--subtle); font-size: 11.5px; line-height: 1.6; }
    .mail-meta { margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
    .mail-preview { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .code-box {
      margin-top: 10px;
      padding: 8px 8px 8px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border: 1px solid var(--green-border);
      border-radius: 10px;
      background: var(--green-soft);
    }
    .code-value { color: var(--green); font: 750 21px/1.2 var(--mono); letter-spacing: .14em; overflow-wrap: anywhere; }
    .copy-code {
      height: 32px; padding: 0 12px;
      display: inline-flex; align-items: center; gap: 6px;
      border: 0; border-radius: 7px;
      background: var(--green);
      color: #fff;
      cursor: pointer;
      font-size: 12.5px; font-weight: 650;
      flex: 0 0 auto;
      transition: background-color .15s;
    }
    .copy-code:hover { background: var(--green-strong); }
    .copy-code.done { background: var(--accent); }
    .code-box.large { padding: 10px 10px 10px 18px; max-width: 440px; }
    .code-box.large .code-value { font-size: 28px; }
    .code-box.large .copy-code { height: 38px; padding: 0 16px; font-size: 13px; }

    .list-empty, .loading { padding: 48px 24px; text-align: center; color: var(--muted); font-size: 13px; }
    .list-empty strong { display: block; margin-bottom: 6px; color: var(--text); font-size: 14px; }
    .list-empty span { display: block; max-width: 250px; margin: 0 auto; font-size: 12.5px; line-height: 1.6; }
    .empty-icon { width: 52px; height: 52px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 16px; background: var(--accent-soft); color: var(--accent); }
    .empty-icon svg { width: 24px; height: 24px; }
    .loading::before { content: ""; display: block; width: 22px; height: 22px; margin: 0 auto 12px; border: 2.5px solid var(--surface-3); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .content { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
    .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; color: var(--muted); }
    .empty strong { margin-bottom: 6px; color: var(--text); font-size: 15px; }
    .empty span { font-size: 13px; }
    .mail-detail { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .detail-head { flex: 0 0 auto; padding: 20px 24px; display: flex; gap: 10px; align-items: flex-start; border-bottom: 1px solid var(--border); background: var(--surface); }
    .detail-main { min-width: 0; flex: 1; }
    .detail-title { margin-bottom: 10px; font-size: 19px; font-weight: 700; line-height: 1.4; letter-spacing: -.01em; overflow-wrap: anywhere; }
    .detail-info { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 12.5px; }
    .detail-info span { overflow-wrap: anywhere; }
    .detail-info b { color: var(--subtle); font-weight: 600; margin-right: 4px; }
    .detail-code { margin-top: 14px; }
    .detail-code .code-box { margin-top: 0; }
    .detail-body { flex: 1; min-height: 0; padding: 16px; }
    .mail-frame { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; color-scheme: light; box-shadow: var(--shadow-sm); }
    .back-btn { display: none; }

    .toast {
      position: fixed; z-index: 50;
      left: 50%; bottom: 28px;
      transform: translate(-50%, 12px);
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--text);
      color: var(--bg);
      font-size: 13px; font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s, transform .18s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; position: relative; }
      .sidebar, .content { position: absolute; inset: 0; border-right: 0; }
      .content { display: none; }
      .app.detail-open .sidebar { display: none; }
      .app.detail-open .content { display: flex; }
      .back-btn { display: inline-flex; margin-left: -8px; }
      .topbar { padding: 0 14px; }
      .status-pill .pill-text { display: none; }
      .status-pill { width: 30px; padding: 0; justify-content: center; }
      .detail-head { padding: 14px; }
      .detail-title { font-size: 16px; }
      .detail-body { padding: 0; }
      .mail-frame { border: 0; border-radius: 0; box-shadow: none; }
    }

    @media (max-width: 480px) {
      .login-page { padding: 16px; align-items: flex-start; padding-top: 10vh; }
      .login-card { padding: 28px 22px 22px; }
      .brand-subtitle { max-width: 170px; }
      .sidebar-controls { flex-direction: column; align-items: stretch; }
      .filter-tabs { display: flex; }
      .filter-tab { flex: 1; }
      .sidebar-actions .btn { flex: 1; }
      .code-box.large .code-value { font-size: 24px; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2Z"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M17 6l3 3M14 9l2 2"/></symbol>
  </svg>

  <div id="loginPage" class="login-page">
    <div class="login-card">
      <div class="brand-mark"><svg><use href="#i-shield"/></svg></div>
      <h1>登录验证码收件箱</h1>
      <p class="lead">使用邮箱账号和密码连接收件箱，自动筛出验证码，一键复制。</p>

      <div class="field">
        <label for="emailInput">邮箱账号</label>
        <input id="emailInput" class="control" type="email" placeholder="user@edu.zitw.de" autocomplete="username" />
      </div>

      <div class="field">
        <label for="passwordInput">邮箱密码</label>
        <input id="passwordInput" class="control" type="password" placeholder="请输入邮箱密码" autocomplete="current-password" />
      </div>

      <button id="loginBtn" class="btn btn-primary btn-block">登录邮箱</button>
      <div id="loginError" class="error hidden"></div>

      <ul class="features">
        <li>自动识别验证码</li>
        <li>新邮件自动刷新</li>
        <li>仅保留本次会话</li>
      </ul>
      <div class="admin-link"><a href="/admin">管理员登录</a></div>
    </div>
  </div>

  <div id="appPage" class="app hidden">
    <div class="topbar">
      <div class="app-brand">
        <div class="brand-mark"><svg><use href="#i-shield"/></svg></div>
        <div style="min-width: 0;">
          <div class="brand-title">验证码收件箱</div>
          <div id="userEmail" class="brand-subtitle"></div>
        </div>
      </div>

      <div class="top-actions">
        <div id="pollStatus" class="status-pill" title="刷新频率"><span class="live-dot"></span><span class="pill-text">普通模式 · 10 秒刷新</span></div>
        <button id="logoutBtn" class="btn btn-ghost btn-icon" title="退出登录" aria-label="退出登录"><svg class="icon"><use href="#i-logout"/></svg></button>
      </div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="sidebar-title-row">
            <div class="sidebar-title">收件箱</div>
            <div id="mailCount" class="mail-count">0 封</div>
          </div>
          <div class="sidebar-controls">
            <div class="filter-tabs" role="tablist" aria-label="邮件筛选">
              <button id="codeFilterBtn" class="filter-tab active" type="button" role="tab">验证码</button>
              <button id="allFilterBtn" class="filter-tab" type="button" role="tab">全部邮件</button>
            </div>
            <div class="sidebar-actions">
              <button id="waitCodeBtn" class="btn btn-boost" title="接下来 2 分钟每 2 秒刷新一次"><svg class="icon"><use href="#i-bolt"/></svg>加速</button>
              <button id="refreshBtn" class="btn btn-secondary" title="立即刷新"><svg class="icon"><use href="#i-refresh"/></svg>刷新</button>
            </div>
          </div>
        </div>

        <div id="mailList" class="mail-list">
          <div class="loading">正在加载邮件…</div>
        </div>
      </aside>

      <main class="content">
        <div id="emptyState" class="empty">
          <div class="empty-icon"><svg><use href="#i-mail"/></svg></div>
          <strong>选择一封邮件</strong>
          <span>邮件内容会在这里显示</span>
        </div>

        <div id="mailDetail" class="mail-detail hidden">
          <div class="detail-head">
            <button id="backBtn" class="btn btn-ghost btn-icon back-btn" aria-label="返回收件箱"><svg class="icon"><use href="#i-back"/></svg></button>
            <div class="detail-main">
              <div id="detailTitle" class="detail-title"></div>
              <div class="detail-info">
                <span id="detailFrom"></span>
                <span id="detailTo"></span>
                <span id="detailDate"></span>
              </div>
              <div id="detailCodeWrap" class="detail-code hidden"></div>
            </div>
          </div>

          <div class="detail-body">
            <iframe id="mailFrame" class="mail-frame" sandbox="" title="邮件正文"></iframe>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const API = "";

    let token = sessionStorage.getItem("mail_panel_token") || "";
    let currentEmail = sessionStorage.getItem("mail_panel_email") || "";
    let mails = [];
    let selectedUidl = "";
    let activeFilter = "codes";
    let pollTimer = null;
    let fastUntil = 0;
    let toastTimer = null;

    const loginPage = document.getElementById("loginPage");
    const appPage = document.getElementById("appPage");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");
    const userEmail = document.getElementById("userEmail");
    const mailList = document.getElementById("mailList");
    const mailCount = document.getElementById("mailCount");
    const codeFilterBtn = document.getElementById("codeFilterBtn");
    const allFilterBtn = document.getElementById("allFilterBtn");
    const waitCodeBtn = document.getElementById("waitCodeBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const pollStatus = document.getElementById("pollStatus");
    const pollText = pollStatus.querySelector(".pill-text");
    const backBtn = document.getElementById("backBtn");
    const toastEl = document.getElementById("toast");

    const emptyState = document.getElementById("emptyState");
    const mailDetail = document.getElementById("mailDetail");
    const detailTitle = document.getElementById("detailTitle");
    const detailFrom = document.getElementById("detailFrom");
    const detailTo = document.getElementById("detailTo");
    const detailDate = document.getElementById("detailDate");
    const detailCodeWrap = document.getElementById("detailCodeWrap");
    const mailFrame = document.getElementById("mailFrame");

    const isMobile = () => window.matchMedia("(max-width: 900px)").matches;

    function showLogin() {
      loginPage.classList.remove("hidden");
      appPage.classList.add("hidden");
    }

    function showApp() {
      loginPage.classList.add("hidden");
      appPage.classList.remove("hidden");
      userEmail.textContent = currentEmail;
    }

    function setError(msg) {
      loginError.textContent = msg;
      loginError.classList.remove("hidden");
    }

    function clearError() {
      loginError.textContent = "";
      loginError.classList.add("hidden");
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    async function request(path, options = {}) {
      const headers = options.headers || {};
      headers["Content-Type"] = headers["Content-Type"] || "application/json";

      if (token) {
        headers["Authorization"] = "Bearer " + token;
      }

      const res = await fetch(API + path, {
        ...options,
        headers
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok || data.success === false) {
        const err = new Error(data.detail || data.message || "请求失败");
        err.status = res.status;
        throw err;
      }

      return data;
    }

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      if (!value) return "";
      const d = new Date(value);
      return isNaN(d.getTime()) ? value : d.toLocaleString("zh-CN", { hour12: false });
    }

    function shortDate(value) {
      if (!value) return "";
      const d = new Date(value);
      if (isNaN(d.getTime())) return value;
      if (d.toDateString() === new Date().toDateString()) {
        return d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
      }
      return d.toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" });
    }

    function copyText(text, button) {
      const done = () => {
        showToast("已复制 " + text);
        if (button) {
          const original = button.textContent;
          button.textContent = "已复制";
          button.classList.add("done");
          setTimeout(() => {
            button.textContent = original;
            button.classList.remove("done");
          }, 1400);
        }
      };
      navigator.clipboard.writeText(text).then(done).catch(() => {
        const input = document.createElement("textarea");
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
        done();
      });
    }

    function codeBoxHtml(code, large) {
      return `
        <div class="code-box${large ? " large" : ""}">
          <span class="code-value">${escapeHtml(code)}</span>
          <button class="copy-code" type="button" data-code="${escapeHtml(code)}">复制</button>
        </div>
      `;
    }

    function bindCopyButtons(root) {
      root.querySelectorAll(".copy-code[data-code]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          copyText(button.dataset.code || "", button);
        });
      });
    }

    function bindMailListEvents() {
      mailList.querySelectorAll(".mail-item").forEach(item => {
        item.addEventListener("click", () => {
          openMail(item.dataset.uidl || "");
        });
      });
      bindCopyButtons(mailList);
    }

    function updatePollStatus() {
      const fast = Date.now() < fastUntil;
      pollStatus.classList.toggle("fast", fast);
      pollText.textContent = fast ? "加速模式 · 2 秒刷新" : "普通模式 · 10 秒刷新";
    }

    function startFastMode() {
      fastUntil = Date.now() + 120 * 1000;
      updatePollStatus();
    }

    function getPollDelay() {
      if (Date.now() < fastUntil) {
        return 2000;
      }
      return 10000;
    }

    function schedulePoll() {
      clearTimeout(pollTimer);

      const delay = getPollDelay();
      updatePollStatus();

      pollTimer = setTimeout(async () => {
        await loadMails(false);
        if (token) schedulePoll();
      }, delay);
    }

    function getVisibleMails() {
      return activeFilter === "codes" ? mails.filter(mail => Boolean(mail.code)) : mails;
    }

    function showNoSelection() {
      selectedUidl = "";
      mailDetail.classList.add("hidden");
      emptyState.classList.remove("hidden");
      appPage.classList.remove("detail-open");
    }

    function renderMailList() {
      const visibleMails = getVisibleMails();
      const codeCount = mails.filter(mail => Boolean(mail.code)).length;
      mailCount.textContent = activeFilter === "codes"
        ? `${codeCount} 个验证码`
        : `${mails.length} 封邮件`;

      if (!visibleMails.length) {
        const title = activeFilter === "codes" ? "暂未收到验证码" : "暂无邮件";
        const hint = activeFilter === "codes"
          ? "页面会自动刷新；普通邮件可在“全部邮件”中查看"
          : "新邮件到达后会自动显示在这里";
        mailList.innerHTML = `
          <div class="list-empty">
            <div class="empty-icon"><svg><use href="#i-key"/></svg></div>
            <strong>${title}</strong>
            <span>${hint}</span>
          </div>
        `;
        return;
      }

      mailList.innerHTML = visibleMails.map(mail => {
        const active = mail.uidl === selectedUidl ? "active" : "";
        return `
          <div class="mail-item ${active}" data-uidl="${escapeHtml(mail.uidl)}">
            <div class="mail-card-top">
              <div class="mail-subject">${escapeHtml(mail.subject || "无主题")}</div>
              <div class="mail-time">${escapeHtml(shortDate(mail.date))}</div>
            </div>
            <div class="mail-meta">${escapeHtml(mail.from_name || mail.from || "未知发件人")}</div>
            ${mail.code ? codeBoxHtml(mail.code, false) : ""}
            ${mail.code ? "" : `<div class="mail-preview">${escapeHtml(mail.preview || "")}</div>`}
          </div>
        `;
      }).join("");
      bindMailListEvents();
    }

    async function handleSessionError(err) {
      if (err.status === 401) {
        await logout();
        setError("登录已过期，请重新登录");
        return true;
      }
      return false;
    }

    async function loadMails(showLoading = true) {
      if (showLoading) {
        mailList.innerHTML = '<div class="loading">正在加载邮件…</div>';
      }

      try {
        const data = await request("/api/mail/list?limit=30");
        mails = data.mails || [];
        const visibleMails = getVisibleMails();

        if (selectedUidl && !visibleMails.some(mail => mail.uidl === selectedUidl)) {
          showNoSelection();
        }
        renderMailList();

        if (!selectedUidl && visibleMails.length && !isMobile()) {
          await openMail(visibleMails[0].uidl);
        } else if (!visibleMails.length) {
          showNoSelection();
        }
      } catch (err) {
        if (await handleSessionError(err)) return;
        mailList.innerHTML = `<div class="list-empty"><strong>读取失败</strong><span>${escapeHtml(err.message)}</span></div>`;
      }
    }

    async function openMail(uidl) {
      selectedUidl = uidl;
      renderMailList();

      emptyState.classList.add("hidden");
      mailDetail.classList.remove("hidden");
      appPage.classList.add("detail-open");

      detailTitle.textContent = "加载中…";
      detailFrom.textContent = "";
      detailTo.textContent = "";
      detailDate.textContent = "";
      detailCodeWrap.classList.add("hidden");
      mailFrame.srcdoc = "";

      try {
        const data = await request("/api/mail/detail?uidl=" + encodeURIComponent(uidl));
        const mail = data.mail;

        detailTitle.textContent = mail.subject || "无主题";
        detailFrom.innerHTML = "<b>发件人</b>" + escapeHtml(mail.from_name ? `${mail.from_name} <${mail.from}>` : mail.from || "");
        detailTo.innerHTML = "<b>收件人</b>" + escapeHtml(mail.to_raw || mail.to || "");
        detailDate.innerHTML = "<b>时间</b>" + escapeHtml(formatDate(mail.date));

        if (mail.code) {
          detailCodeWrap.classList.remove("hidden");
          detailCodeWrap.innerHTML = codeBoxHtml(mail.code, true);
          bindCopyButtons(detailCodeWrap);
        } else {
          detailCodeWrap.classList.add("hidden");
          detailCodeWrap.innerHTML = "";
        }

        const body = mail.html
          ? mail.html
          : `<pre style="white-space:pre-wrap;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;line-height:1.7;font-size:15px;color:#111827;">${escapeHtml(mail.text || "")}</pre>`;

        mailFrame.srcdoc = `
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <base target="_blank">
            <style>
              body {
                margin: 0;
                padding: 22px;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
                color: #111827;
                line-height: 1.6;
                word-break: break-word;
              }
              img {
                max-width: 100%;
                height: auto;
              }
              table {
                max-width: 100%;
              }
              a {
                color: #4f5bd5;
              }
            </style>
          </head>
          <body>${body}</body>
          </html>
        `;
      } catch (err) {
        if (await handleSessionError(err)) return;
        detailTitle.textContent = "读取失败";
        mailFrame.srcdoc = `<pre>${escapeHtml(err.message)}</pre>`;
      }
    }

    async function setFilter(filter) {
      activeFilter = filter;
      codeFilterBtn.classList.toggle("active", filter === "codes");
      allFilterBtn.classList.toggle("active", filter === "all");

      const visibleMails = getVisibleMails();
      if (!visibleMails.some(mail => mail.uidl === selectedUidl)) {
        showNoSelection();
      }
      renderMailList();

      if (!selectedUidl && visibleMails.length && !isMobile()) {
        await openMail(visibleMails[0].uidl);
      }
    }

    async function login() {
      clearError();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        setError("请输入邮箱账号和密码");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "登录中…";

      try {
        const data = await request("/api/user/login", {
          method: "POST",
          body: JSON.stringify({ email, password })
        });

        token = data.token;
        currentEmail = data.email;

        sessionStorage.setItem("mail_panel_token", token);
        sessionStorage.setItem("mail_panel_email", currentEmail);

        passwordInput.value = "";
        showApp();
        startFastMode();
        await loadMails(true);
        schedulePoll();
      } catch (err) {
        setError(err.message);
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "登录邮箱";
      }
    }

    async function logout() {
      clearTimeout(pollTimer);
      const oldToken = token;
      token = "";
      try {
        await request("/api/user/logout", {
          method: "POST",
          body: JSON.stringify({ token: oldToken })
        });
      } catch (e) {}

      currentEmail = "";
      selectedUidl = "";
      mails = [];

      sessionStorage.removeItem("mail_panel_token");
      sessionStorage.removeItem("mail_panel_email");

      showNoSelection();
      showLogin();
    }

    loginBtn.addEventListener("click", login);

    passwordInput.addEventListener("keydown", e => {
      if (e.key === "Enter") login();
    });

    emailInput.addEventListener("keydown", e => {
      if (e.key === "Enter") login();
    });

    refreshBtn.addEventListener("click", () => loadMails(true));
    codeFilterBtn.addEventListener("click", () => setFilter("codes"));
    allFilterBtn.addEventListener("click", () => setFilter("all"));
    backBtn.addEventListener("click", () => {
      selectedUidl = "";
      appPage.classList.remove("detail-open");
      renderMailList();
    });

    waitCodeBtn.addEventListener("click", async () => {
      startFastMode();
      showToast("已开启加速：接下来 2 分钟每 2 秒刷新");
      await loadMails(true);
      schedulePoll();
    });

    logoutBtn.addEventListener("click", logout);

    if (token && currentEmail) {
      showApp();
      startFastMode();
      loadMails(true);
      schedulePoll();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
