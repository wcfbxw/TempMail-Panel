<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>验证码收件箱</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      color: #111827;
      height: 100vh;
      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    .login-page {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 420px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      padding: 34px;
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.04em;
    }

    .login-card p {
      margin: 0 0 28px;
      color: #6b7280;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
    }

    .form-group input {
      width: 100%;
      height: 48px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      background: #fff;
      transition: all 0.2s;
    }

    .form-group input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      width: 100%;
      height: 50px;
      background: #4f46e5;
      color: #fff;
      box-shadow: 0 12px 28px rgba(79, 70, 229, 0.25);
    }

    .btn-primary:hover {
      background: #4338ca;
      transform: translateY(-1px);
    }

    .btn-light {
      background: #f3f4f6;
      color: #111827;
    }

    .btn-light:hover {
      background: #e5e7eb;
    }

    .btn-success {
      background: #10b981;
      color: #fff;
    }

    .btn-success:hover {
      background: #059669;
    }

    .error {
      margin-top: 16px;
      color: #dc2626;
      font-size: 14px;
      line-height: 1.5;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid #e5e7eb;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .brand-subtitle {
      font-size: 12px;
      color: #6b7280;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-pill {
      padding: 8px 12px;
      background: #eef2ff;
      color: #4338ca;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 380px 1fr;
      min-height: 0;
    }

    .sidebar {
      border-right: 1px solid #e5e7eb;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .sidebar-head {
      padding: 16px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
    }

    .mail-list {
      flex: 1;
      overflow: auto;
      padding: 12px;
    }

    .mail-item {
      border: 1px solid #e5e7eb;
      background: #fff;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.18s;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.04);
    }

    .mail-item:hover {
      transform: translateY(-1px);
      border-color: #c7d2fe;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
    }

    .mail-item.active {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.14);
    }

    .mail-subject {
      font-weight: 800;
      font-size: 14px;
      line-height: 1.35;
      margin-bottom: 6px;
      color: #111827;
    }

    .mail-meta {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mail-preview {
      font-size: 13px;
      color: #4b5563;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .code-box {
      margin: 10px 0;
      padding: 10px 12px;
      border-radius: 14px;
      background: #ecfdf5;
      color: #047857;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .copy-small {
      border: none;
      background: #10b981;
      color: #fff;
      border-radius: 10px;
      padding: 6px 9px;
      font-size: 12px;
      cursor: pointer;
    }

    .content {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #f8fafc;
    }

    .empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 16px;
    }

    .mail-detail {
      height: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .detail-head {
      padding: 22px 26px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }

    .detail-title {
      font-size: 22px;
      font-weight: 850;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .detail-info {
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: #4b5563;
    }

    .detail-code {
      margin-top: 16px;
      max-width: 360px;
    }

    .detail-body {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 18px;
    }

    .mail-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 16px 50px rgba(15, 23, 42, 0.08);
    }

    .loading {
      padding: 16px;
      color: #6b7280;
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        height: 45vh;
        border-right: none;
        border-bottom: 1px solid #e5e7eb;
      }

      .content {
        height: 55vh;
      }

      .topbar {
        height: auto;
        padding: 12px;
        gap: 10px;
        flex-direction: column;
        align-items: stretch;
      }

      .top-actions {
        justify-content: space-between;
      }
    }
  </style>
  <style id="otp-inbox-redesign">
    :root {
      --page: #f5f6fa;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --ink: #111827;
      --muted: #667085;
      --line: #e7e9f0;
      --accent: #5b5bd6;
      --accent-dark: #4646bd;
      --accent-soft: #eeeeff;
      --success: #0d9f6e;
      --success-soft: #e8f8f1;
      --danger: #d92d20;
      --shadow: 0 24px 70px rgba(15, 23, 42, 0.10);
    }

    body {
      background:
        radial-gradient(circle at 8% 10%, rgba(91, 91, 214, 0.10), transparent 28%),
        radial-gradient(circle at 92% 92%, rgba(13, 159, 110, 0.08), transparent 30%),
        var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .login-page {
      padding: 32px;
    }

    .login-card {
      width: min(940px, 100%);
      min-height: 560px;
      padding: 0;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow);
    }

    .login-hero {
      position: relative;
      padding: 52px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      color: #fff;
      background:
        radial-gradient(circle at 75% 15%, rgba(255, 255, 255, 0.22), transparent 28%),
        linear-gradient(145deg, #3838a8, #6262dc 58%, #7777e8);
    }

    .login-hero::after {
      content: "";
      position: absolute;
      right: -90px;
      bottom: -110px;
      width: 320px;
      height: 320px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      box-shadow: 0 0 0 42px rgba(255, 255, 255, 0.06), 0 0 0 84px rgba(255, 255, 255, 0.04);
    }

    .hero-brand,
    .app-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 20px;
      font-weight: 900;
    }

    .hero-brand strong {
      font-size: 16px;
      letter-spacing: -0.01em;
    }

    .hero-copy {
      position: relative;
      z-index: 1;
      max-width: 330px;
    }

    .hero-copy h1 {
      margin: 0 0 18px;
      color: #fff;
      font-size: clamp(34px, 4vw, 48px);
      line-height: 1.08;
      letter-spacing: -0.055em;
    }

    .hero-copy p {
      margin: 0;
      color: rgba(255, 255, 255, 0.76);
      font-size: 15px;
      line-height: 1.75;
    }

    .hero-feature {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 13px;
    }

    .hero-feature span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6ee7b7;
      box-shadow: 0 0 0 6px rgba(110, 231, 183, 0.14);
    }

    .login-form-panel {
      padding: 58px 52px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      margin-bottom: 10px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .login-form-panel h2 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    .login-form-panel > p {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      margin-bottom: 9px;
      color: #344054;
      font-size: 13px;
      font-weight: 750;
    }

    .form-group input {
      height: 52px;
      border-color: #dfe2ea;
      border-radius: 14px;
      background: #fbfcfe;
    }

    .form-group input:focus {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(91, 91, 214, 0.10);
    }

    .btn {
      border-radius: 12px;
    }

    .btn-primary {
      background: var(--accent);
      box-shadow: 0 12px 24px rgba(91, 91, 214, 0.22);
    }

    .btn-primary:hover {
      background: var(--accent-dark);
    }

    .admin-link {
      margin-top: 22px;
      text-align: center;
      font-size: 13px;
    }

    .admin-link a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
    }

    .app {
      background: var(--page);
    }

    .topbar {
      height: 74px;
      padding: 0 24px;
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
    }

    .app-brand .brand-mark {
      width: 40px;
      height: 40px;
      color: #fff;
      border: none;
      background: linear-gradient(145deg, var(--accent), #7777e8);
      box-shadow: 0 8px 20px rgba(91, 91, 214, 0.20);
    }

    .brand-title {
      font-size: 17px;
      letter-spacing: -0.025em;
    }

    .brand-subtitle {
      max-width: 300px;
      overflow: hidden;
      color: var(--muted);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-actions {
      gap: 8px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      color: #475467;
      background: #f2f4f7;
      font-size: 12px;
    }

    .status-pill::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(13, 159, 110, 0.12);
    }

    .layout {
      grid-template-columns: 410px minmax(0, 1fr);
    }

    .sidebar {
      border-color: var(--line);
      background: rgba(250, 251, 253, 0.94);
      backdrop-filter: blur(18px);
    }

    .sidebar-head {
      padding: 18px 18px 14px;
      display: block;
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.72);
    }

    .sidebar-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .sidebar-title {
      font-size: 16px;
      font-weight: 820;
      letter-spacing: -0.025em;
    }

    .mail-count {
      padding: 4px 8px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 11px;
      font-weight: 750;
    }

    .sidebar-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .filter-tabs {
      display: inline-flex;
      padding: 4px;
      border-radius: 12px;
      background: #eef0f5;
    }

    .filter-tab {
      border: none;
      padding: 8px 12px;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
    }

    .filter-tab.active {
      color: var(--ink);
      background: #fff;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    .sidebar-actions {
      display: flex;
      gap: 7px;
    }

    .sidebar-actions .btn {
      padding: 9px 11px;
      font-size: 12px;
    }

    .btn-success {
      color: var(--accent-dark);
      background: var(--accent-soft);
    }

    .btn-success:hover {
      background: #dfdfff;
    }

    .mail-list {
      padding: 12px 14px 24px;
    }

    .mail-item {
      margin-bottom: 9px;
      padding: 15px;
      border-color: transparent;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.045);
    }

    .mail-item:hover {
      border-color: #d9d9ff;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.075);
    }

    .mail-item.active {
      border-color: #b7b7f5;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(91, 91, 214, 0.10), 0 12px 25px rgba(15, 23, 42, 0.07);
    }

    .mail-card-top,
    .mail-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .mail-subject {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
    }

    .code-badge {
      flex-shrink: 0;
      padding: 4px 7px;
      color: var(--success);
      border-radius: 7px;
      background: var(--success-soft);
      font-size: 10px;
      font-weight: 800;
    }

    .mail-meta {
      margin: 7px 0 0;
      font-size: 11px;
    }

    .mail-preview {
      margin-top: 10px;
      color: #667085;
      font-size: 12px;
      -webkit-line-clamp: 2;
    }

    .code-box {
      margin: 12px 0 0;
      padding: 11px 12px;
      color: #067647;
      border: 1px solid #cceedd;
      border-radius: 12px;
      background: linear-gradient(135deg, #edfbf4, #f5fdf9);
      font-size: 20px;
      letter-spacing: 0.12em;
    }

    .copy-small {
      padding: 7px 10px;
      color: #fff;
      border-radius: 8px;
      background: var(--success);
      font-weight: 750;
    }

    .list-empty {
      min-height: 280px;
      padding: 44px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .empty-icon {
      width: 54px;
      height: 54px;
      margin-bottom: 16px;
      display: grid;
      place-items: center;
      color: var(--accent);
      border-radius: 18px;
      background: var(--accent-soft);
      font-size: 24px;
    }

    .list-empty strong {
      margin-bottom: 7px;
      font-size: 14px;
    }

    .list-empty span {
      max-width: 230px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .content {
      background: #f4f5f8;
    }

    .empty {
      padding: 30px;
      flex-direction: column;
      color: var(--muted);
      text-align: center;
    }

    .empty strong {
      margin-bottom: 8px;
      color: #344054;
      font-size: 16px;
    }

    .empty span {
      font-size: 13px;
    }

    .detail-head {
      padding: 22px 28px 20px;
      border-color: var(--line);
    }

    .detail-title {
      margin-bottom: 14px;
      font-size: 22px;
      line-height: 1.35;
    }

    .detail-info {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .detail-code {
      max-width: 420px;
      margin-top: 14px;
    }

    .detail-code .code-box {
      margin: 0;
    }

    .detail-body {
      padding: 18px 20px 20px;
    }

    .mail-frame {
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.07);
    }

    .error {
      color: var(--danger);
    }

    @media (max-width: 900px) {
      .login-card {
        width: min(520px, 100%);
        min-height: auto;
        grid-template-columns: 1fr;
      }

      .login-hero {
        min-height: 210px;
        padding: 30px;
      }

      .hero-copy h1 {
        margin-top: 35px;
        font-size: 32px;
      }

      .hero-feature {
        display: none;
      }

      .login-form-panel {
        padding: 34px 30px 38px;
      }

      .topbar {
        height: 66px;
        padding: 0 14px;
        flex-direction: row;
        align-items: center;
      }

      .status-pill {
        display: none;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        height: 44vh;
      }

      .content {
        height: 56vh;
      }

      .detail-head {
        padding: 16px 18px;
      }

      .detail-title {
        font-size: 18px;
      }

      .detail-body {
        padding: 10px;
      }
    }

    @media (max-width: 560px) {
      .login-page {
        padding: 14px;
      }

      .login-hero {
        display: none;
      }

      .login-card {
        border-radius: 22px;
      }

      .login-form-panel {
        padding: 36px 24px;
      }

      .brand-subtitle {
        max-width: 170px;
      }

      .sidebar-controls {
        align-items: stretch;
        flex-direction: column;
      }

      .filter-tabs {
        display: flex;
      }

      .filter-tab {
        flex: 1;
      }

      .sidebar-actions .btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div id="loginPage" class="login-page">
    <div class="login-card">
      <section class="login-hero">
        <div class="hero-brand">
          <div class="brand-mark">M</div>
          <strong>Mailroom</strong>
        </div>
        <div class="hero-copy">
          <h1>验证码，<br />一眼找到。</h1>
          <p>自动筛选验证码邮件，减少无关内容干扰。新邮件到达后，无需反复翻找正文。</p>
        </div>
        <div class="hero-feature"><span></span>安全连接 · 自动刷新 · 一键复制</div>
      </section>

      <section class="login-form-panel">
        <div class="eyebrow">Secure mailbox</div>
        <h2>登录邮箱</h2>
        <p>使用邮箱账号和密码连接收件箱。登录信息仅用于本次会话。</p>

        <div class="form-group">
          <label for="emailInput">邮箱账号</label>
          <input id="emailInput" type="email" placeholder="user@edu.zitw.de" autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="passwordInput">邮箱密码</label>
          <input id="passwordInput" type="password" placeholder="请输入邮箱密码" autocomplete="current-password" />
        </div>

        <button id="loginBtn" class="btn btn-primary">登录邮箱</button>
        <div class="admin-link"><a href="/admin">管理员登录</a></div>
        <div id="loginError" class="error hidden"></div>
      </section>
    </div>
  </div>

  <div id="appPage" class="app hidden">
    <div class="topbar">
      <div class="app-brand">
        <div class="brand-mark">M</div>
        <div class="brand">
          <div class="brand-title">验证码收件箱</div>
          <div id="userEmail" class="brand-subtitle"></div>
        </div>
      </div>

      <div class="top-actions">
        <div id="pollStatus" class="status-pill">快速刷新中</div>
        <button id="logoutBtn" class="btn btn-light">退出登录</button>
      </div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="sidebar-title-row">
            <div class="sidebar-title">收件箱</div>
            <div id="mailCount" class="mail-count">0 封</div>
          </div>
          <div class="sidebar-controls">
            <div class="filter-tabs" aria-label="邮件筛选">
              <button id="codeFilterBtn" class="filter-tab active" type="button">验证码</button>
              <button id="allFilterBtn" class="filter-tab" type="button">全部邮件</button>
            </div>
            <div class="sidebar-actions">
              <button id="waitCodeBtn" class="btn btn-success">加速刷新</button>
              <button id="refreshBtn" class="btn btn-light">刷新</button>
            </div>
          </div>
        </div>

        <div id="mailList" class="mail-list">
          <div class="loading">正在加载邮件...</div>
        </div>
      </aside>

      <main class="content">
        <div id="emptyState" class="empty">
          <div class="empty-icon">✦</div>
          <strong>选择一封邮件</strong>
          <span>邮件内容会在这里显示</span>
        </div>

        <div id="mailDetail" class="mail-detail hidden">
          <div class="detail-head">
            <div id="detailTitle" class="detail-title"></div>
            <div class="detail-info">
              <div id="detailFrom"></div>
              <div id="detailTo"></div>
              <div id="detailDate"></div>
            </div>
            <div id="detailCodeWrap" class="detail-code hidden"></div>
          </div>

          <div class="detail-body">
            <iframe id="mailFrame" class="mail-frame" sandbox=""></iframe>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    const API = "";

    let token = sessionStorage.getItem("mail_panel_token") || "";
    let currentEmail = sessionStorage.getItem("mail_panel_email") || "";
    let mails = [];
    let selectedUidl = "";
    let activeFilter = "codes";
    let pollTimer = null;
    let fastUntil = 0;

    const loginPage = document.getElementById("loginPage");
    const appPage = document.getElementById("appPage");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");
    const userEmail = document.getElementById("userEmail");
    const mailList = document.getElementById("mailList");
    const mailCount = document.getElementById("mailCount");
    const codeFilterBtn = document.getElementById("codeFilterBtn");
    const allFilterBtn = document.getElementById("allFilterBtn");
    const waitCodeBtn = document.getElementById("waitCodeBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const pollStatus = document.getElementById("pollStatus");

    const emptyState = document.getElementById("emptyState");
    const mailDetail = document.getElementById("mailDetail");
    const detailTitle = document.getElementById("detailTitle");
    const detailFrom = document.getElementById("detailFrom");
    const detailTo = document.getElementById("detailTo");
    const detailDate = document.getElementById("detailDate");
    const detailCodeWrap = document.getElementById("detailCodeWrap");
    const mailFrame = document.getElementById("mailFrame");

    function showLogin() {
      loginPage.classList.remove("hidden");
      appPage.classList.add("hidden");
    }

    function showApp() {
      loginPage.classList.add("hidden");
      appPage.classList.remove("hidden");
      userEmail.textContent = currentEmail;
    }

    function setError(msg) {
      loginError.textContent = msg;
      loginError.classList.remove("hidden");
    }

    function clearError() {
      loginError.textContent = "";
      loginError.classList.add("hidden");
    }

    async function request(path, options = {}) {
      const headers = options.headers || {};
      headers["Content-Type"] = headers["Content-Type"] || "application/json";

      if (token) {
        headers["Authorization"] = "Bearer " + token;
      }

      const res = await fetch(API + path, {
        ...options,
        headers
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok || data.success === false) {
        throw new Error(data.detail || data.message || "请求失败");
      }

      return data;
    }

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      if (!value) return "";
      try {
        const d = new Date(value);
        if (!isNaN(d.getTime())) {
          return d.toLocaleString();
        }
      } catch (e) {}
      return value;
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).catch(() => {
        const input = document.createElement("textarea");
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
      });
    }

    function bindMailListEvents() {
      mailList.querySelectorAll(".mail-item").forEach(item => {
        item.addEventListener("click", () => {
          openMail(item.dataset.uidl || "");
        });
      });

      mailList.querySelectorAll(".copy-small[data-code]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          copyText(button.dataset.code || "");
        });
      });
    }

    function startFastMode() {
      fastUntil = Date.now() + 120 * 1000;
      pollStatus.textContent = "验证码模式：2秒刷新";
    }

    function getPollDelay() {
      if (Date.now() < fastUntil) {
        return 2000;
      }
      return 10000;
    }

    function schedulePoll() {
      clearTimeout(pollTimer);

      const delay = getPollDelay();

      if (Date.now() >= fastUntil) {
        pollStatus.textContent = "普通模式：10秒刷新";
      }

      pollTimer = setTimeout(async () => {
        await loadMails(false);
        schedulePoll();
      }, delay);
    }

    function getVisibleMails() {
      return activeFilter === "codes" ? mails.filter(mail => Boolean(mail.code)) : mails;
    }

    function showNoSelection() {
      selectedUidl = "";
      mailDetail.classList.add("hidden");
      emptyState.classList.remove("hidden");
    }

    function renderMailList() {
      const visibleMails = getVisibleMails();
      const codeCount = mails.filter(mail => Boolean(mail.code)).length;
      mailCount.textContent = activeFilter === "codes"
        ? `${codeCount} 个验证码`
        : `${mails.length} 封邮件`;

      if (!visibleMails.length) {
        const title = activeFilter === "codes" ? "暂未收到验证码" : "暂无邮件";
        const hint = activeFilter === "codes"
          ? "系统会自动刷新；普通邮件可在“全部邮件”中查看"
          : "新邮件到达后会自动显示在这里";
        mailList.innerHTML = `
          <div class="list-empty">
            <div class="empty-icon">✦</div>
            <strong>${title}</strong>
            <span>${hint}</span>
          </div>
        `;
        return;
      }

      mailList.innerHTML = visibleMails.map(mail => {
        const active = mail.uidl === selectedUidl ? "active" : "";
        const codeHtml = mail.code ? `
          <div class="code-box">
            <span>${escapeHtml(mail.code)}</span>
            <button class="copy-small" data-code="${escapeHtml(mail.code)}">复制</button>
          </div>
        ` : "";

        return `
          <div class="mail-item ${active}" data-uidl="${escapeHtml(mail.uidl)}">
            <div class="mail-card-top">
              <div class="mail-subject">${escapeHtml(mail.subject || "无主题")}</div>
              ${mail.code ? '<span class="code-badge">验证码</span>' : ''}
            </div>
            <div class="mail-meta">${escapeHtml(mail.from_name || mail.from || "未知发件人")} · ${escapeHtml(formatDate(mail.date))}</div>
            ${codeHtml}
            <div class="mail-preview">${escapeHtml(mail.preview || "")}</div>
          </div>
        `;
      }).join("");
      bindMailListEvents();
    }

    async function loadMails(showLoading = true) {
      if (showLoading) {
        mailList.innerHTML = '<div class="loading">正在加载邮件...</div>';
      }

      try {
        const data = await request("/api/mail/list?limit=30");
        mails = data.mails || [];
        const visibleMails = getVisibleMails();

        if (selectedUidl && !visibleMails.some(mail => mail.uidl === selectedUidl)) {
          showNoSelection();
        }
        renderMailList();

        if (!selectedUidl && visibleMails.length) {
          await openMail(visibleMails[0].uidl);
        } else if (!visibleMails.length) {
          showNoSelection();
        }
      } catch (err) {
        mailList.innerHTML = `<div class="loading">读取失败：${escapeHtml(err.message)}</div>`;
      }
    }

    async function openMail(uidl) {
      selectedUidl = uidl;
      renderMailList();

      emptyState.classList.add("hidden");
      mailDetail.classList.remove("hidden");

      detailTitle.textContent = "加载中...";
      detailFrom.textContent = "";
      detailTo.textContent = "";
      detailDate.textContent = "";
      detailCodeWrap.classList.add("hidden");
      mailFrame.srcdoc = "";

      try {
        const data = await request("/api/mail/detail?uidl=" + encodeURIComponent(uidl));
        const mail = data.mail;

        detailTitle.textContent = mail.subject || "无主题";
        detailFrom.textContent = "发件人：" + (mail.from_name ? `${mail.from_name} <${mail.from}>` : mail.from || "");
        detailTo.textContent = "收件人：" + (mail.to_raw || mail.to || "");
        detailDate.textContent = "时间：" + formatDate(mail.date);

        if (mail.code) {
          detailCodeWrap.classList.remove("hidden");
          detailCodeWrap.innerHTML = `
            <div class="code-box">
              <span>${escapeHtml(mail.code)}</span>
              <button class="copy-small" onclick="copyText('${escapeHtml(mail.code)}')">复制验证码</button>
            </div>
          `;
        } else {
          detailCodeWrap.classList.add("hidden");
          detailCodeWrap.innerHTML = "";
        }

        const body = mail.html
          ? mail.html
          : `<pre style="white-space:pre-wrap;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;line-height:1.7;font-size:15px;color:#111827;">${escapeHtml(mail.text || "")}</pre>`;

        mailFrame.srcdoc = `
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <base target="_blank">
            <style>
              body {
                margin: 0;
                padding: 22px;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
                color: #111827;
                line-height: 1.6;
                word-break: break-word;
              }
              img {
                max-width: 100%;
                height: auto;
              }
              table {
                max-width: 100%;
              }
              a {
                color: #4f46e5;
              }
            </style>
          </head>
          <body>${body}</body>
          </html>
        `;
      } catch (err) {
        detailTitle.textContent = "读取失败";
        mailFrame.srcdoc = `<pre>${escapeHtml(err.message)}</pre>`;
      }
    }

    async function setFilter(filter) {
      activeFilter = filter;
      codeFilterBtn.classList.toggle("active", filter === "codes");
      allFilterBtn.classList.toggle("active", filter === "all");

      const visibleMails = getVisibleMails();
      if (!visibleMails.some(mail => mail.uidl === selectedUidl)) {
        showNoSelection();
      }
      renderMailList();

      if (!selectedUidl && visibleMails.length) {
        await openMail(visibleMails[0].uidl);
      }
    }

    async function login() {
      clearError();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        setError("请输入邮箱账号和密码");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "登录中...";

      try {
        const data = await request("/api/user/login", {
          method: "POST",
          body: JSON.stringify({ email, password })
        });

        token = data.token;
        currentEmail = data.email;

        sessionStorage.setItem("mail_panel_token", token);
        sessionStorage.setItem("mail_panel_email", currentEmail);

        showApp();
        startFastMode();
        await loadMails(true);
        schedulePoll();
      } catch (err) {
        setError(err.message);
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "登录邮箱";
      }
    }

    async function logout() {
      try {
        await request("/api/user/logout", {
          method: "POST",
          body: JSON.stringify({ token })
        });
      } catch (e) {}

      clearTimeout(pollTimer);
      token = "";
      currentEmail = "";
      selectedUidl = "";
      mails = [];

      sessionStorage.removeItem("mail_panel_token");
      sessionStorage.removeItem("mail_panel_email");

      showLogin();
    }

    loginBtn.addEventListener("click", login);

    passwordInput.addEventListener("keydown", e => {
      if (e.key === "Enter") login();
    });

    emailInput.addEventListener("keydown", e => {
      if (e.key === "Enter") login();
    });

    refreshBtn.addEventListener("click", () => loadMails(true));
    codeFilterBtn.addEventListener("click", () => setFilter("codes"));
    allFilterBtn.addEventListener("click", () => setFilter("all"));

    waitCodeBtn.addEventListener("click", async () => {
      startFastMode();
      await loadMails(true);
      schedulePoll();
    });

    logoutBtn.addEventListener("click", logout);

    if (token && currentEmail) {
      showApp();
      startFastMode();
      loadMails(true);
      schedulePoll();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
